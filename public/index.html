<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kedai Pulo</title>
  <meta name="description" content="Kedai Pulo POS Sistem Kasir Modern untuk F&B">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app">
    <!-- Login -->
    <div id="login-page" class="login-page">
      <div class="login-wrapper">
        <div class="login-card">
          <div class="login-logo">
            <div class="logo-icon">KP</div>
            <h1>Kedai Pulo</h1>
          </div>
          <form id="login-form" autocomplete="off">
            <div class="form-group">
              <label for="login-username">Username</label>
              <input type="text" id="login-username" placeholder="Masukkan username" required autofocus>
            </div>
            <div class="form-group">
              <label for="login-password">Password</label>
              <input type="password" id="login-password" placeholder="Masukkan password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full" id="login-btn">
              <span>Masuk</span>
            </button>
            <p id="login-error" class="error-text" style="display:none"></p>
          </form>
        </div>
        <!-- Author Credit -->
        <div style="text-align:center;margin-top:1.25rem;color:rgba(255,255,255,0.35);font-size:0.75rem;line-height:1.7">
          <span>Dibuat oleh <strong style="color:rgba(255,255,255,0.55)">DewaMerdeka</strong></span><br>
          <a href="https://instagram.com/dewanjeng" target="_blank" rel="noopener"
             style="color:rgba(255,255,255,0.45);text-decoration:none;display:inline-flex;align-items:center;gap:0.3rem;margin-top:0.15rem">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
              <circle cx="12" cy="12" r="4"/>
              <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
            </svg>
            @dewanjeng
          </a>
        </div>
      </div>
    </div>

    <!-- Main App -->
    <div id="main-app" style="display:none">
      <!-- Sidebar -->
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-logo">
            <div class="logo-icon-sm">KP</div>
            <span class="sidebar-brand">Kedai Pulo</span>
          </div>
        </div>
        <nav class="sidebar-nav">
          <a href="#" class="nav-item active" data-page="dashboard">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            <span>Dashboard</span>
          </a>
          <a href="#" class="nav-item" data-page="pos">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
            <span>Kasir</span>
          </a>
          <div class="nav-divider"><span>Master Data</span></div>
          <a href="#" class="nav-item" data-page="menu" data-roles="admin,kasir">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8h1a4 4 0 010 8h-1"/><path d="M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
            <span>Menu</span>
          </a>
          <a href="#" class="nav-item" data-page="categories" data-roles="admin">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
            <span>Kategori</span>
          </a>
          <a href="#" class="nav-item" data-page="ingredients" data-roles="admin">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
            <span>Bahan Baku</span>
          </a>
          <div class="nav-divider"><span>Inventaris</span></div>
          <a href="#" class="nav-item" data-page="stocks" data-roles="admin,kasir,owner">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>
            <span>Stok</span>
          </a>
          <div class="nav-divider"><span>Keuangan</span></div>
          <a href="#" class="nav-item" data-page="expenses" data-roles="admin,kasir,owner">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
            <span>Pengeluaran</span>
          </a>
          <a href="#" class="nav-item" data-page="discounts" data-roles="admin,owner">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="9" r="2"/><circle cx="15" cy="15" r="2"/><line x1="5" y1="19" x2="19" y2="5"/><rect x="2" y="2" width="20" height="20" rx="3"/></svg>
            <span>Diskon</span>
          </a>
          <a href="#" class="nav-item" data-page="reports" data-roles="admin,owner">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            <span>Laporan</span>
          </a>
          <div class="nav-divider"><span>Pengaturan</span></div>
          <a href="#" class="nav-item" data-page="users" data-roles="admin">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
            <span>Pengguna</span>
          </a>
          <a href="#" class="nav-item" data-page="printers" data-roles="admin">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
            <span>Printer</span>
          </a>
        </nav>
        <div class="sidebar-footer">
          <div class="user-info">
            <div class="user-avatar" id="user-avatar">A</div>
            <div class="user-details">
              <span class="user-name" id="user-name">Admin</span>
              <span class="user-role" id="user-role">admin</span>
            </div>
          </div>
          <button class="btn-icon" id="logout-btn" title="Logout">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
        <!-- Author Credit Sidebar -->
        <div style="padding:0.5rem 1rem 0.75rem;text-align:center;border-top:1px solid rgba(255,255,255,0.06);margin-top:0.25rem">
          <span style="font-size:0.7rem;color:rgba(255,255,255,0.28)">by DewaMerdeka &nbsp;·&nbsp;
            <a href="https://instagram.com/dewanjeng" target="_blank" rel="noopener"
               style="color:rgba(255,255,255,0.38);text-decoration:none">@dewanjeng</a>
          </span>
        </div>
      </aside>

      <!-- Main Content -->
      <main id="main-content" class="main-content">
        <header class="top-bar">
          <button class="btn-icon sidebar-toggle" id="sidebar-toggle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <h2 id="page-title" class="page-title">Dashboard</h2>
          <div class="top-bar-right">
            <span class="current-time" id="current-time"></span>
            <div class="notification-bell" id="notification-bell" title="Notifikasi stok">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
              <span class="notif-badge" id="notif-badge" style="display:none">0</span>
            </div>
          </div>
        </header>
        <div id="page-content" class="page-content">
          <!-- Pages rendered here -->
        </div>
      </main>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Modal Backdrop -->
    <div id="modal-backdrop" class="modal-backdrop" style="display:none">
      <div id="modal-content" class="modal-content"></div>
    </div>
  </div>

  <!-- Print Frame -->
  <iframe id="print-frame" style="display:none"></iframe>

  <script src="/js/brand.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/print.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/pos.js"></script>
  <script src="/js/menu.js"></script>
  <script src="/js/categories.js"></script>
  <script src="/js/ingredients.js"></script>
  <script src="/js/stocks.js"></script>
  <script src="/js/expenses.js"></script>
  <script src="/js/discounts.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script src="/js/excel-export.js"></script>
  <script src="/js/reports.js"></script>
  <script src="/js/users.js"></script>
  <script src="/js/printers.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
